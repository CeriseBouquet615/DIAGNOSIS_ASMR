<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASMR推し診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 夜更けにそっと話しかける、やさしく親密な声
   IDEA: 深夜ラジオのチューナー。質問に答えるたびに周波数が合っていく
   PICTURE: ヘッドホンから広がる音の輪。回答が進むほど輪が増え、結果で共鳴する
   COLOUR and TYPE: 夜の藍 #17143a、ラベンダー #b9a8ff、灯りのピーチ #ffb38a／Zen Maru Gothic
   LAYOUT: 上に音の輪と進捗、その下に一問ずつ大きな選択肢。結果は1位を大きく、VTuber部門と総合を並べる */
:root{color-scheme:dark;--bg:#17143a;--bg2:#211d4d;--card:#2a2560;--ink:#f4f0ff;--mute:#b8b0dc;--lav:#b9a8ff;--acc:#ffb38a;--line:#3d377a;--mint:#8fe3cf}
:root[data-theme=light]{color-scheme:light;--bg:#efeaff;--bg2:#e3dcff;--card:#ffffff;--ink:#1d1845;--mute:#5b5488;--lav:#6a52e0;--acc:#d9632c;--line:#cfc6f5;--mint:#167a64}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Zen Maru Gothic",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:clamp(20px,4vw,48px) max(4vw,16px) 64px}
h1{font-size:clamp(26px,5vw,40px);line-height:1.1;margin:0;font-weight:900;text-wrap:balance}
.sub{color:var(--mute);margin:6px 0 0;font-size:15px}
.stage{position:relative;height:clamp(160px,28vw,220px);margin:12px 0 8px}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.ring{fill:none;stroke:var(--lav);transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.ring.on{animation:pulse 3.2s ease-out infinite}
@media(prefers-reduced-motion:reduce){.ring.on{animation:none;opacity:.5}}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lav),var(--acc));transition:width .4s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin:8px 0 18px}
.q{font-size:clamp(21px,3.6vw,28px);font-weight:700;line-height:1.3;margin:0 0 6px;text-wrap:balance}
.hint{color:var(--mute);font-size:14px;margin:0 0 16px;min-height:1.4em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.opt{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;cursor:pointer;min-height:56px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,transform .15s}
.opt b{font-size:17px}.opt span{font-size:13.5px;color:var(--mute)}
.opt:hover{border-color:var(--lav)}.opt:active{transform:scale(.98)}
.opt[aria-pressed=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.opt:focus-visible,.btn:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:999px;padding:12px 22px;min-height:46px;cursor:pointer;border:2px solid var(--line);background:transparent;color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1d1240}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock .btn{flex:1;max-width:260px;background:var(--bg2)}.dock .btn.pri{background:var(--acc)}
#app:has(.dock){padding-bottom:96px}
.btn:disabled{opacity:.4;cursor:default}
.top{background:var(--card);border-radius:24px;padding:clamp(20px,4vw,32px);border:2px solid var(--acc)}
.badge{display:inline-block;background:var(--acc);color:#1d1240;font-weight:900;border-radius:999px;padding:3px 12px;font-size:13px}
.top h2{font-size:clamp(28px,5.5vw,44px);line-height:1.08;margin:10px 0 4px}
.pct{font-size:clamp(40px,8vw,64px);font-weight:900;color:var(--acc);line-height:1;white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tags span{background:var(--bg2);color:var(--lav);border-radius:999px;padding:3px 10px;font-size:13px}
.tags span.mic{color:var(--mint);border:1px solid var(--mint)}
.tags span.vt{color:var(--acc);border:1px solid var(--acc)}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--mute);font-size:14px;margin:4px 0 0}
.facts b{color:var(--ink);font-weight:700;white-space:nowrap}
.why{margin:10px 0 0;padding-left:1.2em}.why li{margin:3px 0}
.infer{background:var(--bg2);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14.5px}
.infer b{color:var(--mint)}
.first{background:var(--bg2);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:15px}
.first b{color:var(--acc)}
a.go{display:inline-flex;align-items:center;gap:6px;margin-top:16px;color:var(--ink);background:var(--bg2);border:2px solid var(--lav);border-radius:999px;padding:10px 18px;font-weight:700;text-decoration:none;min-height:44px}
.runners{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin-top:12px}
.run{background:var(--card);border-radius:18px;padding:16px 18px;border:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.run h3{margin:0;font-size:19px;line-height:1.25}.run p{margin:0;color:var(--mute);font-size:14px}
.run .m{color:var(--lav);font-weight:900;white-space:nowrap}
.run a{color:var(--lav);font-size:14px;margin-top:auto}
.run .tags{margin:2px 0}
h4{font-size:19px;margin:30px 0 4px}
.h4sub{color:var(--mute);font-size:14px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.chip{font:inherit;font-size:14px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--lav);background:var(--bg2)}
.all{display:grid;gap:6px}
.all a{color:inherit;text-decoration:none}.all a:hover{text-decoration:underline}
.all div{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) 3.2em;gap:10px;align-items:center;font-size:14px}
.all .t{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.all .t i{display:block;height:100%;background:var(--lav)}
.all .t i.v{background:var(--acc)}
.all .n{text-align:right;color:var(--mute)}
details.src{margin-top:26px;background:var(--bg2);border-radius:14px;padding:12px 16px;font-size:13.5px;color:var(--mute)}
details.src summary{cursor:pointer;color:var(--ink);font-weight:700;min-height:32px}
details.src table{width:100%;border-collapse:collapse;margin-top:8px}
details.src td,details.src th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
details.src td.num{text-align:right;white-space:nowrap}
.note{color:var(--mute);font-size:13px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:96px;z-index:30;transform:translateX(-50%);background:var(--acc);color:#1d1240;font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:600px){.all div{grid-template-columns:minmax(0,8em) minmax(0,1fr) 3em}details.src table{font-size:12.5px}}
</style>
</head>

/* ---------- 計算 ---------- */
function weights(h=hist){
  const w=C.map(()=>1);
  h.forEach(({q,o})=>{const f=QI[q].o[o][2];C.forEach((c,i)=>{w[i]*=f(c)})});
  rejected.forEach(n=>{const i=C.findIndex(c=>c.name===n);if(i>=0)w[i]=0});
  const s=w.reduce((a,b)=>a+b,0)||1;return w.map(x=>x/s);
}
const H=p=>{let h=0;for(const x of p)if(x>1e-12)h-=x*Math.log(x);return h};
function bestQuestion(w){
  const asked=new Set(hist.map(h=>h.q));
  const fixed=Q.find(q=>q.fixed&&!asked.has(q.id));if(fixed)return {q:fixed,gain:9};
  const H0=H(w);let best=null;
  for(const q of Q){
    if(asked.has(q.id)||(q.after&&!asked.has(q.after))||(q.when&&!q.when(hist)))continue;
    const L=C.map(c=>q.o.map(o=>o[2](c)));          // 尤度
    const P=L.map(r=>{const s=r.reduce((a,b)=>a+b,0);return r.map(x=>x/s)}); // チャンネルごとの答えの分布
    let exp=0;
    for(let k=0;k<q.o.length;k++){
      const post=w.map((x,i)=>x*P[i][k]);const pk=post.reduce((a,b)=>a+b,0);
      if(pk>0)exp+=pk*H(post.map(x=>x/pk));
    }
    const gain=H0-exp;
    if(!best||gain>best.gain)best={q,gain};
  }
  return best;
}
const effN=w=>Math.exp(H(w));

function drawRings(n,on){let h='';for(let k=0;k<n;k++)h+=`<circle class="ring ${on?'on':''}" cx="200" cy="120" r="${46+k*11}" stroke-width="${on?2:1.5}" opacity="${on?0:.22+k*.06}" style="animation-delay:${k*.4}s"/>`;rings.innerHTML=h}

/* ---------- 質問画面 ---------- */
function render(){
  const w=weights(),n=effN(w),top=Math.max(...w);
  const nb=bestQuestion(w);
  const done=hist.length>=MAX_Q+3*rejected.length||!nb||(hist.length>=Math.max(MIN_Q,extra)&&(top>=0.5||n<=2.2))||(hist.length>=Math.max(MIN_Q,extra)&&nb.gain<0.015);
  if(done)return (rejected.length>=3||!nb)?renderResult():renderGuess(w);
  const q=nb.q;drawRings(Math.min(8,Math.max(1,Math.round(9-Math.log2(n+1)))),false);
  const pct=Math.round(100*(1-Math.log(n)/Math.log(C.length)));
  app.innerHTML=`<div class="bar"><i style="width:${Math.max(4,pct)}%"></i></div>
  <div class="meta"><span>質問 ${hist.length+1}</span><span>残りの候補 <b>約${Math.max(1,Math.round(n))}</b> / ${C.length} チャンネル</span></div>
  <h2 class="q">${q.q}</h2><p class="hint">${q.h||''}</p>
  <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><b>${o[0]}</b>${o[1]?`<span>${o[1]}</span>`:''}</button>`).join('')}</div>
  <div class="nav"><button class="btn" id="back" ${hist.length?'':'disabled'}>← ひとつ戻る</button>
  ${hist.length>=4?'<button class="btn" id="now">ここで結果を見る</button>':''}</div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{hist.push({q:q.id,o:+b.dataset.k});save();render()});
  document.getElementById('back').onclick=()=>{hist.pop();save();render()};
  const nw=document.getElementById('now');if(nw)nw.onclick=()=>renderGuess(weights());
}

  <button class="btn" id="no">ちがう、続ける</button><button class="btn pri" id="yes">この人！結果を見る</button></div>`;
  document.getElementById('yes').onclick=()=>renderResult();
  document.getElementById('no').onclick=()=>{rejected.push(c.name);save();continueAfterReject()};
  document.getElementById('back').onclick=()=>{hist.pop();save();render()};
}
function continueAfterReject(){
  // 外したあとは最低3問追加で聞いてから再予想
  extra=Math.max(extra,hist.length+3);render();
}

/* ---------- 結果画面 ---------- */
function reasons(c){
  const out=[];
  hist.forEach(({q,o})=>{
    const Qd=QI[q];
    if(Qd.trait&&o<=1&&c.f[Qd.trait]>=0.5)out.push(LABEL[Qd.trait]);
    if(q==='lang'&&o<3)out.push(['日本語','海外のASMR','韓国語'][o]);
    if(q==='vt'&&o<2)out.push(o===0?'VTuber':'実写・手元映像');
    if(q==='live'&&o<2&&(o===0?c.live>=0.5:c.live<0.5))out.push(o===0?'生配信が中心':'動画投稿が中心');
    if(q==='mic'&&o<2&&(o===0?hasKU(c):c.mic.length))out.push(o===0?'KU100を使用':'立体音響');
    if(q==='voice'&&o===1&&c.f.none>=0.5)out.push('ノートーク');
    if(q==='freq'&&o<4&&[c.pw>=5,c.pw>=2&&c.pw<5,c.pw>=0.8&&c.pw<2,c.pw<0.8][o])out.push(['ほぼ毎日配信','週2〜4回のペース','週1回くらいのペース','マイペースな更新'][o]);
    if(q==='size2'&&o<3&&[c.subs>=5e5,c.subs>=1.5e5&&c.subs<5e5,c.subs<1.5e5][o])out.push(['登録者50万人以上','登録者15万〜50万人','登録者15万人未満'][o]);
    if(q==='micType'&&o<3&&[hasKU(c),c.mic.some(m=>/3Dio/.test(m)),c.mic.some(m=>/SR3D|ダミー/.test(m))][o])out.push(['KU100','3Dio','SR3D・ダミーヘッド'][o]+'を使用');
    if(q==='size'&&o<3&&['big','mid','small'][o]===tier(c))out.push(['登録者100万人以上','登録者20万〜100万人','登録者5万〜20万人'][o]);
    if(q==='time'&&o<4&&c.tb&&c.tb[o]>=0.4)out.push(['朝・昼','夕方〜夜早め','夜21〜24時','深夜0時以降'][o]+'によく配信');
    if(q==='sex'&&o<2&&c.g===['f','m'][o])out.push(['女性','男性'][o]+'の配信者');
    if(q==='vtype'&&o<3){const k=['cute','onee','low'][o];if(c.f[k]>=0.5)out.push(LABEL[k])}
  });
  return [...new Set(out)].slice(0,5);
}
const micTags=c=>c.mic.map(m=>`<span class="mic">${esc(m)}</span>`).join('');
const vtTag=c=>(c.g==='m'?'<span>男性</span>':'')+(c.vt?`<span class="vt">VTuber・${esc(c.org)}</span>`:`<span>${esc(c.org)}</span>`)+(c.spicy?'<span>刺激強めの回あり</span>':'');
const subsLine=c=>(c.subs?`登録者 <b>${fmt(c.subs)}</b>`:`登録者数 <b>非公開</b>`)+(c.last?`・最終配信 ${c.last}`:'');
const timeLine=c=>c.tb?`よく配信する時間帯：<b>${c.th}時ごろ</b>`:'';
const featTags=c=>Object.keys(LABEL).filter(k=>c.f[k]>=0.5&&!(['onee','low','cute'].includes(k)&&c.f[k]<0.6)).map(k=>LABEL[k]);
function card(x){
  return `<div class="run"><div class="row"><h3>${esc(x.c.name)}</h3><span class="m">${x.p}%</span></div>
  <div class="tags">${vtTag(x.c)}${micTags(x.c)}</div><p>${esc(x.c.desc)}</p><p>${subsLine(x.c)}${x.c.tb?'・'+timeLine(x.c):''}</p>
  <a href="${yt(x.c)}" target="_blank" rel="noopener">YouTubeで見る ↗</a></div>`;
}

function renderResult(){
  const keepRej=rejected;rejected=[];const w=weights();rejected=keepRej;const hideS=hist.some(h=>h.q==='spicy'&&h.o===2);const sx=(hist.find(h=>h.q==='sex')||{}).o,hideG=sx===0?'m':sx===1?'f':null;
  const max=Math.max(...w);
  const r=C.map((c,i)=>({c,w:w[i],p:Math.round(100*Math.sqrt(w[i]/max))})).filter(x=>!(hideS&&x.c.spicy)&&!(hideG&&(x.c.g===hideG||(hideG==='f'&&x.c.g==='b')))).sort((a,b)=>b.w-a.w);
  const t=r.find(x=>!rejected.includes(x.c.name))||r[0],conf=Math.round(100*t.w/r.reduce((a,b)=>a+b.w,0));
  drawRings(6,true);
  const vtTop=r.filter(x=>x.c.vt&&x!==t).slice(0,3),realTop=r.filter(x=>!x.c.vt&&x!==t).slice(0,3);
  const why=reasons(t.c),inf=featTags(t.c);
  app.innerHTML=`<div class="bar"><i style="width:100%"></i></div>
  <div class="meta"><span>${hist.length}問で診断しました</span><span>${C.length}チャンネルから絞り込み</span></div>
  <section class="top">
    <span class="badge">${rejected.length?'予想を'+rejected.length+'回外したあとの':''}あなたの推しは…</span>
    <div class="row"><h2>${esc(t.c.name)}</h2><div class="pct" title="確信度">${conf}%</div></div>
    <p class="h4sub" style="margin:0">確信度：残った候補の中でこのチャンネルが当てはまる確率</p>
    <div class="tags">${vtTag(t.c)}${micTags(t.c)}</div>
    <div class="facts"><span>${subsLine(t.c)}</span>${t.c.tb?`<span>${timeLine(t.c)}</span>`:''}</div>
    <p style="margin:12px 0 0">${esc(t.c.desc)}</p>
    ${why.length?`<ul class="why">${why.map(h=>`<li>「${h}」があなたの答えと一致</li>`).join('')}</ul>`:''}
    ${inf.length?`<div class="infer"><b>最近の配信タイトルから見た特徴：</b>${inf.join('・')}</div>`:''}
    <div class="first"><b>最初の1本におすすめ：</b>${esc(t.c.first)}</div>
    <a class="go" href="${yt(t.c)}" target="_blank" rel="noopener">YouTubeで見る ↗</a>
  </section>
  ${vtTop.length?`<h4>VTuber部門の次点</h4><div class="runners">${vtTop.map(card).join('')}</div>`:''}
  ${realTop.length?`<h4>実写・その他の次点</h4><div class="runners">${realTop.map(card).join('')}</div>`:''}
  <h4>全チャンネルとの相性</h4><p class="h4sub">一番近いチャンネルを100%としたときの近さ（「ちがう」と答えた予想も含みます）</p>
  <div class="chips" role="group" aria-label="絞り込み">
    <button class="chip" data-f="all">すべて</button><button class="chip" data-f="vt">VTuberのみ</button>
    <button class="chip" data-f="ku">KU100使用</button><button class="chip" data-f="real">実写のみ</button></div>
  <div class="all" id="all"></div>
  <div class="nav"><button class="btn" id="back2">← 最後の質問に戻る</button></div>
  <div class="dock"><button class="btn" id="redo">↻ もう一度診断する</button><button class="btn pri" id="copy">結果をコピー</button></div>`;
  const drawAll=()=>{
    const list=r.filter(x=>filter==='all'||(filter==='vt'&&x.c.vt)||(filter==='real'&&!x.c.vt)||(filter==='ku'&&hasKU(x.c)));
    const shown=showAll?list:list.slice(0,30);
    document.getElementById('all').innerHTML=shown.map(x=>`<div><a href="${yt(x.c)}" target="_blank" rel="noopener">${esc(x.c.name)}</a><span class="t"><i class="${x.c.vt?'v':''}" style="width:${x.p}%"></i></span><span class="n">${x.p}%</span></div>`).join('')
      +(list.length>30&&!showAll?`<button class="chip" id="more">残り${list.length-30}件も表示</button>`:'');
    const mb=document.getElementById('more');if(mb)mb.onclick=()=>{showAll=true;drawAll()};
    app.querySelectorAll('.chip[data-f]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===filter));
  };
  drawAll();
  app.querySelectorAll('.chip[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;showAll=false;drawAll()});
  document.getElementById('back2').onclick=()=>{rejected=[];extra=0;hist.pop();save();render()};
  document.getElementById('redo').onclick=()=>{hist=[];rejected=[];extra=0;showAll=false;save();render();window.scrollTo({top:0,behavior:'smooth'})};
  document.getElementById('copy').onclick=async()=>{
    const txt=`ASMR推し診断（${hist.length}問）の結果：${t.c.name}（確信度${conf}%）\n次点：${r.slice(1,4).map(x=>x.c.name).join('、')}`;
    const toast=document.getElementById('toast');
    try{await navigator.clipboard.writeText(txt);toast.textContent='コピーしました'}catch(e){toast.textContent='コピーできませんでした'}
    toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);
  };
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- 掲載チャンネル表 ---------- */
document.getElementById('subline').textContent=`質問に答えるたびに、${C.length}のASMRチャンネル（VTuber ${C.filter(c=>c.vt).length}人を含む）から候補を絞り込みます`;
document.getElementById('srcBody').innerHTML=`<p>YouTube Data APIで2026年11月22日に取得したデータです。この会話で調べたチャンネルに加え、「ASMR KU100」「ASMR 耳かき 睡眠導入」など20個の言葉で半年以内の動画を検索し、投稿者を自動で集めました。掲載条件は<b>登録者5万人以上</b>・<b>半年以内に配信あり</b>・<b>直近50本のうちASMRのタイトルが6本以上</b>です。</p>
<p>質問はアキネーターと同じ考え方で選んでいます。各チャンネルの特徴（言語、VTuberかどうか、生配信の割合と時間帯、配信頻度、機材、登録者数、最近50本のタイトル・概要欄・タグに出てくる音の種類など）を数値にし、答えによって候補が最も均等に分かれる質問を毎回計算して出します。候補が十分に絞れたら（または${MAX_Q}問で）結果を出します。自動で集めたチャンネルの紹介文はタイトルから機械的に作ったものです。</p>
<table><thead><tr><th>チャンネル</th><th>区分</th><th>機材</th><th class="num">登録者</th></tr></thead><tbody>${C.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.vt?'VTuber':'実写ほか'}<br>最終 ${c.last}</td><td>${esc(c.mic.join(', ')||'—')}</td><td class="num">${fmt(c.subs)}</td></tr>`).join('')}</tbody></table>`;

render();
}

</script>
</body>
</html>
