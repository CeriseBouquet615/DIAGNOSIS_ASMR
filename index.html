<script>
fetch('data.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(C=>{

/* ================= 診断エンジン =================
  各チャンネル c は f（特徴 0〜1）、lang、vt、live、subs、mic、spicy を持つ。
  質問の各選択肢は「このチャンネルならその答えをどれくらい選びそうか」(尤度 0〜1) を返す。
  答えるたびに尤度を掛け合わせ、残りの質問から「答えの分かれ方で候補が最も絞れる（期待エントロピーが最小）」ものを次に出す。 */

const LABEL={ear:'耳かき',whisper:'囁き',brush:'マッサージ・ブラシ',tap:'タッピング',eat:'咀嚼音',obj:'物の音・スクイーズ',cosme:'メイク・スキンケア',cook:'料理の音',rp:'ロールプレイ',none:'ノートーク',talk:'雑談',sleep:'睡眠導入',game:'ゲーム',collab:'コラボ・両耳同時',endure:'長時間・耐久',heart:'心音・添い寝・膝枕',onoma:'オノマトペ・言葉',irl:'実写・コスプレ・手元映像',water:'水・ジェル・泡の音',onee:'お姉さん系の声',low:'低め・ダウナーな声',cute:'甘い・可愛い声'};
const tier=c=>c.subs>=1e6?'big':c.subs>=2e5?'mid':'small';
// 登録者数から「人気者（約18万人〜）／実力派／これから注目（〜約7万人）」をなめらかに判定。掲載チャンネルがほぼ3等分になる境目（境目の人はどちらにも少し入る）
const sig=x=>1/(1+Math.exp(-x));
// 長さ（分）を「短い／中くらい／長い」になめらかに分ける（境目a・bの前後は両方に入る）
const lenM=(m,a,b)=>{const x=Math.log(Math.max(m,1)),l=sig((x-Math.log(b))/0.15),s=sig((Math.log(a)-x)/0.15);return [s,Math.max(0,1-l-s),l]};
const popM=c=>{const x=Math.log10(Math.max(c.subs||5e4,1e4)),b=sig((x-5.25)/0.1),sm=sig((4.85-x)/0.1);return [b,Math.max(0,1-b-sm),sm]};
const hasKU=c=>c.mic.includes('KU100');
const T=(k,q,h,[a,b,cc,d]=['大好き','まあ好き','どちらでもない','苦手'])=>({id:k,q,h,trait:k,o:[
  [a,'',c=>0.06+0.94*c.f[k]],[b,'',c=>0.35+0.65*c.f[k]],[cc,'',()=>1],[d,'',c=>1-0.88*c.f[k]]]});

const Q=[
 {id:'spicy',fixed:1,at:2,q:'耳舐め・耳はむなど、刺激強めの回もあるチャンネルは？',h:'普段は耳かきや囁きが中心で、ときどきそうした回がある人も多いです',o:[

const QI=Object.fromEntries(Q.map(q=>[q.id,q]));

const MAX_Q=20;

/* ---------- 状態 ---------- */

const resetAll=()=>{hist=[];rejected=[];extra=0;mode=null;showAll=false;filter='all';save();render();window.scrollTo({top:0,behavior:'smooth'})};

/* ---------- 計算 ---------- */
// 答え間違い・迷いに強くするため、フィルター以外の質問は尤度を少しだけ底上げする
const LAM=0.1,HARD=new Set(['spicy','sex']);
const lik=(q,o,c)=>{const v=q.o[o][2](c);return HARD.has(q.id)?v:LAM+(1-LAM)*v};
function weights(h=hist){
  const w=C.map(()=>1);
  h.forEach(({q,o})=>{const qq=QI[q];C.forEach((c,i)=>{w[i]*=lik(qq,o,c)})});
  rejected.forEach(n=>{const i=C.findIndex(c=>c.name===n);if(i>=0)w[i]=0});
  const s=w.reduce((a,b)=>a+b,0)||1;return w.map(x=>x/s);
}
const H=p=>{let h=0;for(const x of p)if(x>1e-12)h-=x*Math.log(x);return h};
function bestQuestion(w){
  const asked=new Set(hist.map(h=>h.q));
  const fixed=Q.find(q=>q.fixed&&!asked.has(q.id)&&hist.length>=q.at);if(fixed)return {q:fixed,gain:9};
  const H0=H(w);let best=null;
  for(const q of Q){
    if(q.fixed||asked.has(q.id)||(q.after&&!asked.has(q.after))||(q.when&&!q.when(hist)))continue;
    const L=C.map(c=>q.o.map((o,k)=>lik(q,k,c)));          // 尤度
    const P=L.map(r=>{const s=r.reduce((a,b)=>a+b,0);return r.map(x=>x/s)}); // チャンネルごとの答えの分布
    let exp=0;
    for(let k=0;k<q.o.length;k++){
      const post=w.map((x,i)=>x*P[i][k]);const pk=post.reduce((a,b)=>a+b,0);
      if(pk>0)exp+=pk*H(post.map(x=>x/pk));
    }
    const gain=H0-exp;
    if(!best||gain>best.gain)best={q,gain};
  }
  return best;
}
const effN=w=>Math.exp(H(w));

function drawRings(n,on){let h='';for(let k=0;k<n;k++)h+=`<circle class="ring ${on?'on':''}" cx="200" cy="120" r="${46+k*11}" stroke-width="${on?2:1.5}" opacity="${on?0:.22+k*.06}" style="animation-delay:${k*.4}s"/>`;rings.innerHTML=h}

// みんなの推しランキング（goat_ranking.py が作る ranking.json を表示。なければ出さない）
let RANK=null,rankP=0;
function rankHTML(nameHTML){
  if(!RANK||!RANK.periods||!RANK.periods.some(p=>(p.results||[]).length||(p.favs||[]).length))return '';
  const P=RANK.periods[rankP]||RANK.periods[0];
  const list=(arr,unit)=>arr.length?`<ol class="rk">${arr.map((x,i)=>`<li><span class="no">${i+1}</span>${nameHTML(x.name)}<small>${x.count}${unit}</small></li>`).join('')}</ol>`:'<p class="rkempty">まだデータがありません</p>';
  return `<section class="rank"><div class="rkhd"><h3>みんなの推しランキング</h3><div class="rktabs">${RANK.periods.map((p,i)=>`<button class="chip rkt" data-i="${i}" aria-pressed="${i===rankP}">${p.label}</button>`).join('')}</div></div>

  <p class="rknote">集計：${RANK.updated}時点（アクセス解析の数をもとにしています）</p></section>`;
}

function histBlock(){
  if(!HIST.length)return '';
  const d=t=>{const x=new Date(t);return `${x.getMonth()+1}/${x.getDate()}`};
  const rows=HIST.slice(0,5).map(h=>{const c=C.find(x=>x.name===h.n);return c?`<li><a href="${yt(c)}" target="_blank" rel="noopener">${esc(c.name)}</a><small>${d(h.t)}・${MODES[h.m]?MODES[h.m].label:''}</small></li>`:''}).join('');

}

let _shared=(()=>{try{const r=decodeURIComponent((location.hash.match(/^#r=(.+)$/)||[])[1]||'');return r&&C.find(c=>c.name===r)}catch(e){return null}})();
window.addEventListener('hashchange',()=>{try{const r=decodeURIComponent((location.hash.match(/^#r=(.+)$/)||[])[1]||''),c=r&&C.find(x=>x.name===r);if(c){renderShared(c);window.scrollTo({top:0})}}catch(e){}});
function render(){
  if(_shared){const c=_shared;_shared=null;return renderShared(c)}
  if(!mode&&!hist.length)return renderStart();
  const w=weights(),n=effN(w),top=Math.max(...w);
  const nb=bestQuestion(w);
  const m=M(),maxQ=Math.min(MAX_Q+3*rejected.length,m.max+m.add*rejected.length),lim=Math.max(m.min,extra);
  const done=hist.length>=maxQ||!nb||(hist.length>=lim&&(top>=0.5||n<=2.2))||(hist.length>=lim&&nb.gain<0.015);
  if(done)return (rejected.length>=3||!nb)?renderResult():renderGuess(w);
  if([5,10,15].includes(hist.length))gc('進み具合/'+hist.length+'問回答');
  const q=nb.q;drawRings(Math.min(8,Math.max(1,Math.round(9-Math.log2(n+1)))),false);
  const pct=Math.round(100*(1-Math.log(n)/Math.log(C.length)));
  app.classList.remove('fade');void app.offsetWidth;app.classList.add('fade');
  app.innerHTML=`<div class="bar"><i style="width:${Math.max(4,pct)}%"></i></div>
  <div class="meta"><span>質問 ${hist.length+1}${mode==='quick'?` / ${maxQ}`:''}</span><span>残りの候補 <b>約${Math.max(1,Math.round(n))}</b> / ${C.length} チャンネル</span></div>
  <h2 class="q">${q.q}</h2><p class="hint">${q.h||''}</p>
  <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><b>${o[0]}</b>${o[1]?`<span>${o[1]}</span>`:''}</button>`).join('')}</div>
  <div class="nav"><button class="btn" id="back" ${hist.length?'':'disabled'}>← ひとつ戻る</button>
  ${hist.length>=3||(hist.length>=2&&n<=6)?`<button class="btn" id="now">ここで結果を見る<small style="font-weight:500;opacity:.75;margin-left:6px">候補 約${Math.max(1,Math.round(n))}</small></button>`:''}</div>
  ${hist.length?'<div class="resetrow"><button class="reset" id="reset">↺ 最初からやり直す</button></div>':''}`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{hist.push({q:q.id,o:+b.dataset.k});save();render()});
  document.getElementById('back').onclick=()=>{hist.pop();save();render()};
  const rs=document.getElementById('reset');if(rs)rs.onclick=resetAll;
  const nw=document.getElementById('now');if(nw)nw.onclick=()=>renderGuess(weights());
}

/* ---------- 「この人ですか？」 ---------- */
function renderGuess(w){
  const i=w.indexOf(Math.max(...w)),c=C[i];
  if(hist.some(h=>h.q==='spicy'&&h.o===2)&&c.spicy){rejected.push(c.name);return render()}
  drawRings(6,false);
  app.classList.remove('fade');void app.offsetWidth;app.classList.add('fade');
  app.innerHTML=`<div class="bar"><i style="width:92%"></i></div>
  <div class="meta"><span>${hist.length}問目まで回答</span><span>${rejected.length?`${rejected.length+1}回目の予想`:'予想'}</span></div>
  <h2 class="q">あなたの推しになりそうなのは…</h2>
  <section class="top" style="margin-top:10px">
    <div class="row"><h2>${esc(c.name)}</h2></div>
    <div class="tags">${vtTag(c)}${micTags(c)}</div>
    <div class="facts"><span>${subsLine(c)}</span></div>
    <p style="margin:12px 0 0">${esc(c.desc)}</p>
    <a class="go" href="${yt(c)}" target="_blank" rel="noopener">チャンネルを見てみる ↗</a>
  </section>
  <p class="hint" style="margin-top:16px">${mode==='quick'&&hist.length>=M().max?'聴いてみて合いそうなら「この人！」、違えば次の候補を出します（3回まで）':'聴いてみて合いそうなら「この人！」、違えば質問を続けてもっと絞り込みます'}</p>
  <div class="nav"><button class="btn" id="back">← ひとつ戻る</button>
  <button class="btn" id="no">${mode==='quick'&&hist.length>=M().max?'ちがう、次の候補へ':'ちがう、続ける'}</button><button class="btn pri" id="yes">この人！結果を見る</button></div>
  <div class="resetrow"><button class="reset" id="reset">↺ 最初からやり直す</button></div>`;
  document.getElementById('yes').onclick=()=>renderResult();
  document.getElementById('no').onclick=()=>{rejected.push(c.name);save();continueAfterReject()};
  document.getElementById('back').onclick=()=>{hist.pop();save();render()};
  const rs=document.getElementById('reset');if(rs)rs.onclick=resetAll;
}
function continueAfterReject(){
  // 外したあとは最低3問追加で聞いてから再予想
  extra=Math.max(extra,hist.length+M().add);render();
}

/* ---------- 結果画面 ---------- */
function reasons(c){
  const out=[];
  hist.forEach(({q,o})=>{
    const Qd=QI[q];
    if(Qd.trait&&o<=1&&c.f[Qd.trait]>=0.5)out.push(LABEL[Qd.trait]);
    if(q==='lang'&&o<3)out.push(['日本語','海外のASMR','韓国語'][o]);
    if(q==='vt'&&o<2)out.push(o===0?'VTuber':'実写・手元映像');
    if(q==='live'&&o<2&&(o===0?c.live>=0.5:c.live<0.5))out.push(o===0?'生配信が中心':'動画投稿が中心');
    if(q==='mic'&&o<2&&(o===0?hasKU(c):c.mic.length))out.push(o===0?'KU100を使用':'立体音響');
    if(q==='voice'&&o===1&&c.f.none>=0.5)out.push('ノートーク');
    if(q==='freq'&&o<4&&[c.pw>=5,c.pw>=2&&c.pw<5,c.pw>=0.8&&c.pw<2,c.pw<0.8][o])out.push(['ほぼ毎日配信','週2〜4回のペース','週1回くらいのペース','マイペースな更新'][o]);
    if(q==='micType'&&o<3&&[hasKU(c),c.mic.some(m=>/3Dio/.test(m)),c.mic.some(m=>/SR3D|ダミー/.test(m))][o])out.push(['KU100','3Dio','SR3D・ダミーヘッド'][o]+'を使用');
    if(q==='size'&&o<3&&popM(c)[o]>=0.6)out.push(['みんな知ってる人気者','安定した人気の実力派','これから注目の人'][o]);
    if(q==='vlen'&&o<3&&c.dm!=null&&lenM(c.dm,30,75)[o]>=0.6)out.push(`動画は${c.dm}分くらい`);
    if(q==='slen'&&o<3&&c.lm!=null&&lenM(c.lm,75,150)[o]>=0.6)out.push(`生配信は${c.lm}分くらい`);
    if(q==='week'&&o<2&&c.we!=null&&(o===0?c.we<=0.25:c.we>=0.45))out.push(o===0?'平日によく配信':'週末によく配信');
    if(q==='time'&&o<4&&c.tb&&c.tb[o]>=0.4)out.push(['朝・昼','夕方〜夜早め','夜21〜24時','深夜0時以降'][o]+'によく配信');
    if(q==='sex'&&o<2&&c.g===['f','m'][o])out.push(['女性','男性'][o]+'の配信者');
    if(q==='vtype'&&o<3){const k=['cute','onee','low'][o];if(c.f[k]>=0.5)out.push(LABEL[k])}
  });
  return [...new Set(out)].slice(0,5);
}
const micTags=c=>c.mic.map(m=>`<span class="mic">${esc(m)}</span>`).join('');
const vtTag=c=>(c.g==='m'?'<span>男性</span>':'')+(c.vt?`<span class="vt">VTuber・${esc(c.org)}</span>`:`<span>${esc(c.org)}</span>`)+(c.spicy?'<span>刺激強めの回あり</span>':'');
const subsLine=c=>(c.subs?`登録者 <b>${fmt(c.subs)}</b>`:`登録者数 <b>非公開</b>`)+(c.last?`・最終配信 ${c.last}`:'');
const timeLine=c=>c.tb?`よく配信する時間帯：<b>${c.th}時ごろ</b>`:'';
const featTags=c=>Object.keys(LABEL).filter(k=>c.f[k]>=0.5&&!(['onee','low','cute'].includes(k)&&c.f[k]<0.6)).map(k=>LABEL[k]);
// お気に入り（一覧ページと共通、見ている人のブラウザに保存）
let FAV=new Set();try{FAV=new Set(JSON.parse(localStorage.getItem('asmr-fav')||'[]'))}catch(e){}
const saveFav=()=>{try{localStorage.setItem('asmr-fav',JSON.stringify([...FAV]))}catch(e){}};
const favBtn=c=>`<button class="fav" data-name="${esc(c.name)}" aria-pressed="${FAV.has(c.name)}" aria-label="${esc(c.name)}をお気に入り${FAV.has(c.name)?'から外す':'に追加'}">${FAV.has(c.name)?'★':'☆'}</button>`;
document.addEventListener('click',e=>{const b=e.target.closest('.fav');if(!b)return;const n=b.dataset.name;FAV.has(n)?FAV.delete(n):(FAV.add(n),gc('お気に入り追加/'+n));saveFav();
  document.querySelectorAll('.fav').forEach(x=>{if(x.dataset.name===n){const on=FAV.has(n);x.textContent=on?'★':'☆';x.setAttribute('aria-pressed',on);x.setAttribute('aria-label',n+'をお気に入り'+(on?'から外す':'に追加'))}});
  const fl=document.getElementById('favLink');if(fl)fl.textContent=`★ お気に入り（${FAV.size}）を一覧で見る`;});
// おすすめの1本：答えに合う最近の動画を選ぶ
function pickVideo(c){
  if(!c.v||!c.v.length)return null;
  const like={},why=[];let wantLive=null,sleep=0;
  hist.forEach(({q,o})=>{const qq=QI[q];
    if(qq.trait){like[qq.trait]=o===0?2:o===1?1:o===3?-3:0}
    if(q==='use')sleep=o===0?1:o===1?-1:0;
    if(q==='live')wantLive=o===0?1:o===1?0:null});
  let best=null,bs=-1e9;
  c.v.forEach(([id,title,date,live,keys],i)=>{
    let sc=-0.05*i;keys.forEach(k=>{if(like[k])sc+=like[k]});
    if(sleep&&keys.includes('sleep'))sc+=sleep;
    if(wantLive!==null&&live===wantLive)sc+=0.5;
    if(sc>bs){bs=sc;best={id,title,date,live,keys}}});
  best.match=best.keys.filter(k=>like[k]>0&&LABEL[k]).map(k=>LABEL[k]);
  return best;
}
const vUrl=v=>'https://www.youtube.com/watch?v='+encodeURIComponent(v.id);
function simBlock(c,hideG,hideS){
  const ids=(c.sim||[]).map(j=>C[j]).filter(x=>x&&!(hideS&&x.spicy)&&!(hideG&&(x.g===hideG||(hideG==='f'&&x.g==='b'))));
  if(!ids.length)return '';
  return `<h4 style="margin-top:22px">この人が好きならこちらも</h4><div class="sims">${ids.map(x=>{const v=pickVideo(x);return `<div class="sim"><div class="row"><b>${esc(x.name)}</b>${favBtn(x)}</div><div class="tags">${vtTag(x)}${micTags(x)}</div>${v?`<a class="pv" data-gc="動画クリック/似ている配信者" href="${vUrl(v)}" target="_blank" rel="noopener"><span>▶ ${esc(v.title)}</span></a>`:''}<a href="${yt(x)}" target="_blank" rel="noopener">チャンネルを見る ↗</a></div>`}).join('')}</div>`;
}
function card(x){
  return `<div class="run"><div class="row"><h3>${esc(x.c.name)}</h3><span class="m">${x.p}%</span>${favBtn(x.c)}</div>
  <div class="tags">${vtTag(x.c)}${micTags(x.c)}</div><p>${esc(x.c.desc)}</p><p>${subsLine(x.c)}${x.c.tb?'・'+timeLine(x.c):''}</p>
  ${(v=>v?`<a class="pv" href="${vUrl(v)}" target="_blank" rel="noopener"><span>▶ ${esc(v.title)}</span></a>`:'')(pickVideo(x.c))}
  <a href="${yt(x.c)}" target="_blank" rel="noopener">チャンネルを見る ↗</a></div>`;
}

function renderResult(){
  const keepRej=rejected;rejected=[];const w=weights();rejected=keepRej;const hideS=hist.some(h=>h.q==='spicy'&&h.o===2);const sx=(hist.find(h=>h.q==='sex')||{}).o,hideG=sx===0?'m':sx===1?'f':null;
  const max=Math.max(...w);
  const r=C.map((c,i)=>({c,w:w[i],p:Math.round(100*Math.sqrt(w[i]/max))})).filter(x=>!(hideS&&x.c.spicy)&&!(hideG&&(x.c.g===hideG||(hideG==='f'&&x.c.g==='b')))).sort((a,b)=>b.w-a.w);
  const t=r.find(x=>!rejected.includes(x.c.name))||r[0],conf=Math.round(100*t.w/r.reduce((a,b)=>a+b.w,0));
  drawRings(6,true);addHist(t.c.name,conf);gc('結果/'+(MODES[mode]?MODES[mode].label:'じっくり'));gc('結果の配信者/'+t.c.name);
  const vtTop=r.filter(x=>x.c.vt&&x!==t).slice(0,3),realTop=r.filter(x=>!x.c.vt&&x!==t).slice(0,3);
  const why=reasons(t.c),inf=featTags(t.c);
  app.classList.remove('fade');void app.offsetWidth;app.classList.add('fade');
  app.innerHTML=`<div class="bar"><i style="width:100%"></i></div>
  <div class="meta"><span>${hist.length}問で診断しました</span><span>${C.length}チャンネルから絞り込み</span></div>
  <section class="top">
    <span class="badge">${conf<20?'今の答えでいちばん近いのは…':(rejected.length?'予想を'+rejected.length+'回外したあとの':'')+'あなたの推しは…'}</span>
    <div class="row"><h2>${esc(t.c.name)} ${favBtn(t.c)}</h2><div class="pct" title="確信度">${conf}%</div></div>
    <p class="h4sub" style="margin:0">確信度：残った候補の中でこのチャンネルが当てはまる確率</p>
    ${conf<20?`<p class="h4sub" style="margin:6px 0 0">まだ候補が多い段階の結果です。<button class="reset" id="cont" style="padding:4px 2px;min-height:0">質問を続けると</button>もっと絞り込めます。</p>`:''}
    <div class="tags">${vtTag(t.c)}${micTags(t.c)}</div>
    <div class="facts"><span>${subsLine(t.c)}</span>${t.c.tb?`<span>${timeLine(t.c)}</span>`:''}</div>
    <p style="margin:12px 0 0">${esc(t.c.desc)}</p>
    ${why.length?`<ul class="why">${why.map(h=>`<li>「${h}」があなたの答えと一致</li>`).join('')}</ul>`:''}
    ${inf.length?`<div class="infer"><b>最近の配信タイトルから見た特徴：</b>${inf.join('・')}</div>`:''}
    ${(v=>v?`<a class="pick" data-gc="動画クリック/おすすめの1本" href="${vUrl(v)}" target="_blank" rel="noopener"><span class="pk">▶ まずはこの1本から</span><b>${esc(v.title)}</b><small>${v.date}・${v.live?'生配信のアーカイブ':'動画'}${v.match.length?`・あなたの好きな「${v.match.slice(0,3).join('・')}」入り`:''}</small></a>`:`<div class="first"><b>最初の1本におすすめ：</b>${esc(t.c.first)}</div>`)(pickVideo(t.c))}
    <div class="acts"><a class="go" href="${yt(t.c)}" target="_blank" rel="noopener">チャンネルを見る ↗</a>
    <a class="go share" data-gc="シェア/X" href="https://x.com/intent/post?text=${encodeURIComponent(`今夜の推しASMRで診断したら「${t.c.name}」でした（${hist.length}問・確信度${conf}%）\n#今夜の推しASMR`)}&url=${encodeURIComponent(shareUrl(t.c))}" target="_blank" rel="noopener">𝕏 でシェア</a></div>
    ${simBlock(t.c,hideG,hideS)}
  </section>
  ${vtTop.length?`<h4>VTuber部門の次点</h4><div class="runners">${vtTop.map(card).join('')}</div>`:''}
  ${realTop.length?`<h4>実写・その他の次点</h4><div class="runners">${realTop.map(card).join('')}</div>`:''}
  <h4>全チャンネルとの相性</h4><p class="h4sub">一番近いチャンネルを100%としたときの近さ（「ちがう」と答えた予想も含みます）</p>
  <div class="chips" role="group" aria-label="絞り込み">
    <button class="chip" data-f="all">すべて</button><button class="chip" data-f="vt">VTuberのみ</button>
    <button class="chip" data-f="ku">KU100使用</button><button class="chip" data-f="real">実写のみ</button></div>
  <div class="all" id="all"></div>
  <a class="list" id="favLink" href="channels.html#fav">★ お気に入り（${FAV.size}）を一覧で見る <span>→</span></a>
  <div class="nav"><button class="btn" id="back2">← 最後の質問に戻る</button></div>
  <div class="dock"><button class="btn" id="redo">↻ もう一度診断する</button><button class="btn pri" id="copy">結果をコピー</button></div>`;
  const drawAll=()=>{
    const list=r.filter(x=>filter==='all'||(filter==='vt'&&x.c.vt)||(filter==='real'&&!x.c.vt)||(filter==='ku'&&hasKU(x.c)));
    const shown=showAll?list:list.slice(0,30);
    document.getElementById('all').innerHTML=shown.map(x=>`<div><a href="${yt(x.c)}" target="_blank" rel="noopener">${esc(x.c.name)}</a><span class="t"><i class="${x.c.vt?'v':''}" style="width:${x.p}%"></i></span><span class="n">${x.p}%</span></div>`).join('')
      +(list.length>30&&!showAll?`<button class="chip" id="more">残り${list.length-30}件も表示</button>`:'');
    const mb=document.getElementById('more');if(mb)mb.onclick=()=>{showAll=true;drawAll()};
    app.querySelectorAll('.chip[data-f]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===filter));
  };
  drawAll();
  app.querySelectorAll('.chip[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;showAll=false;drawAll()});
  const ct=document.getElementById('cont');if(ct)ct.onclick=()=>{gc('質問を続ける');if(mode==='quick')mode='deep';extra=hist.length+3;save();render();window.scrollTo({top:0,behavior:'smooth'})};
  document.getElementById('back2').onclick=()=>{rejected=[];extra=0;hist.pop();save();render()};
  document.getElementById('redo').onclick=resetAll;
  document.getElementById('copy').onclick=async()=>{gc('シェア/コピー');
    const txt=`今夜の推しASMR（${hist.length}問）の結果：${t.c.name}（確信度${conf}%）\n次点：${r.slice(1,4).map(x=>x.c.name).join('、')}\n${shareUrl(t.c)}`;
    const toast=document.getElementById('toast');
    try{await navigator.clipboard.writeText(txt);toast.textContent='コピーしました'}catch(e){toast.textContent='コピーできませんでした'}
    toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);
  };
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- 掲載チャンネル表 ---------- */
(function tick(){const d=new Date(),h=d.getHours(),p=n=>String(n).padStart(2,'0'),t=document.getElementById('clockTime'),m=document.getElementById('clockMsg');
  if(t)t.innerHTML=p(h)+'<i class="colon">:</i>'+p(d.getMinutes())+'<small>'+p(d.getSeconds())+'</small>';

document.getElementById('srcBody').innerHTML=`<p>YouTube Data APIで取得したデータです（データ更新日：2026年11月22日）。あらかじめ選んだ配信者に加え、「ASMR KU100」「ASMR 耳かき 睡眠導入」など28個の言葉で半年以内の動画を検索し、投稿者を自動で集めました。掲載条件は<b>登録者3万人以上</b>・<b>半年以内に配信あり</b>・<b>直近50本のうちASMRのタイトルが6本以上</b>で、今は${C.length}チャンネル（VTuber ${C.filter(c=>c.vt).length}人）を載せています。</p>
<p>質問は「20の質問」ゲームと同じ考え方で選んでいます。各チャンネルの特徴（言語、VTuberかどうか、生配信の割合・時間帯・曜日・長さ、動画の長さ、配信頻度、機材、登録者数、最近50本のタイトル・概要欄・タグや再生リスト名に出てくる音の種類など）を数値にし、答えによって候補が最も均等に分かれる質問を毎回計算して出します。候補が十分に絞れたら（または${MAX_Q}問で）結果を出します。声の性別や自動で集めたチャンネルの紹介文は、タイトルなどから推測したものです。チャンネルごとの詳しい情報は<a href="channels.html">掲載チャンネル一覧</a>で見られます。</p>`;


render();
}).catch(err=>{document.getElementById('app').innerHTML='<p style="padding:24px">データを読み込めませんでした。ページを再読み込みしてください。（'+err.message+'）</p>'});
</script>
